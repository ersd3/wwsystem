[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lager"
version = "0.4.0"
description = "Bauteile-Lagersystem: offene Ordnerstruktur, SQLite-Index, Suche, CLI und Web-Server"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx2>=2.0",
]

[project.scripts]
lager = "lager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lager = ["schema.sql", "server/templates/*.html", "server/static/*"]
